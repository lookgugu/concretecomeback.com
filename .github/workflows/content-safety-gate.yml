name: Content safety gate

# Blog posts here give injury, technique and supplement advice to adults over 40 —
# YMYL content where a plausible-sounding error can hurt someone. Automated review
# has already caught P1s like "aim to land on your hip" (the greater trochanter is
# where a hip fracture starts) and curcumin advice with no drug-interaction warning.
#
# This gate makes that review mandatory rather than best-effort, and fails closed
# when the reviewer is unavailable — on 2026-08-14 it was rate-limited and safety
# content shipped unreviewed.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: safety-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    name: Safety review of health content
    runs-on: ubuntu-latest
    steps:
      - name: Require an up-to-date safety review
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          PR: ${{ github.event.pull_request.number }}
          # Exact login, not a substring match: a regex like /codex/i would let any
          # account whose name merely contains "codex" satisfy the gate.
          # NB: GraphQL returns the bare login; REST appends "[bot]". This query is
          # GraphQL, so the bare form is correct — the REST form matches nothing and
          # would block every blog PR forever.
          REVIEWER: 'chatgpt-codex-connector'
        run: |
          # -e matters here: this gate must fail closed. Without it an empty or
          # failed API response yields an empty integer, the comparison errors,
          # the branch is skipped, and the script exits 0 — a green gate that
          # checked nothing.
          set -euo pipefail

          die() { echo "::error::$1"; exit 1; }
          is_int() { case "${1:-}" in ''|*[!0-9]*) return 1 ;; *) return 0 ;; esac }

          files=$(gh api "repos/$OWNER/$REPO/pulls/$PR/files" --paginate --jq '.[].filename') \
            || die "Could not list PR files. Failing closed."
          [ -n "$files" ] || die "PR file list came back empty. Failing closed."

          if ! printf '%s\n' "$files" | grep -q '^src/content/blog/'; then
            echo "No files under src/content/blog/ — safety review not required."
            exit 0
          fi

          echo "Blog content touched:"
          printf '%s\n' "$files" | grep '^src/content/blog/' | sed 's/^/  /'
          echo

          data=$(gh api graphql -F owner="$OWNER" -F repo="$REPO" -F pr="$PR" -f query='
            query($owner:String!,$repo:String!,$pr:Int!){
              repository(owner:$owner,name:$repo){
                pullRequest(number:$pr){
                  headRefOid
                  reviews(last:100){ totalCount nodes { author{login __typename} commit{oid} state } }
                  reviewThreads(last:100){ totalCount nodes { isResolved comments(first:1){ nodes { body } } } }
                  comments(last:100){ totalCount nodes { author{login __typename} body } }
                }
              }
            }') || die "GraphQL query failed. Failing closed."

          # GraphQL reports partial failures in-band with HTTP 200.
          if printf '%s' "$data" | jq -e 'has("errors")' >/dev/null 2>&1; then
            die "GraphQL returned errors: $(printf '%s' "$data" | jq -c '.errors')"
          fi

          pr_json=$(printf '%s' "$data" | jq -e '.data.repository.pullRequest') \
            || die "Could not read pull request from response. Failing closed."
          head=$(printf '%s' "$pr_json" | jq -re '.headRefOid') \
            || die "Could not read head commit. Failing closed."

          # Silent truncation would undercount unresolved findings, so refuse to guess.
          for conn in reviews reviewThreads comments; do
            total=$(printf '%s' "$pr_json" | jq -r --arg c "$conn" '.[$c].totalCount')
            fetched=$(printf '%s' "$pr_json" | jq -r --arg c "$conn" '.[$c].nodes | length')
            is_int "$total" && is_int "$fetched" || die "Bad counts for $conn. Failing closed."
            [ "$total" -le "$fetched" ] || die "$conn truncated ($fetched of $total). Failing closed."
          done

          # DISMISSED reviews must not count as coverage.
          reviewed=$(printf '%s' "$pr_json" | jq --arg h "$head" --arg r "$REVIEWER" \
            '[.reviews.nodes[] | select(.author.login == $r and .author.__typename == "Bot") | select(.state != "DISMISSED") | select(.commit.oid == $h)] | length')
          limited=$(printf '%s' "$pr_json" | jq --arg r "$REVIEWER" \
            '[.comments.nodes[] | select(.author.login == $r and .author.__typename == "Bot") | select(.body|test("usage limits";"i"))] | length')
          # Deliberately broad: if the badge format changes, a stray match blocks
          # (safe) whereas a missed match would pass unreviewed findings (unsafe).
          open_p1=$(printf '%s' "$pr_json" | jq \
            '[.reviewThreads.nodes[] | select(.isResolved|not) | select(.comments.nodes[0].body|test("P1"))] | length')
          open_p2=$(printf '%s' "$pr_json" | jq \
            '[.reviewThreads.nodes[] | select(.isResolved|not) | select(.comments.nodes[0].body|test("P2"))] | length')

          for v in reviewed limited open_p1 open_p2; do
            is_int "$(eval echo \$$v)" || die "Non-numeric result for $v. Failing closed."
          done

          echo "head=$head reviewed_at_head=$reviewed unresolved_P1=$open_p1 unresolved_P2=$open_p2"
          echo

          failed=0

          if [ "$reviewed" -eq 0 ]; then
            failed=1
            if [ "$limited" -gt 0 ]; then
              echo "::error::Safety reviewer was rate-limited — this health content is UNREVIEWED."
            else
              echo "::error::No safety review of the current commit ($head)."
              echo "Either the PR was never reviewed, or content changed after review —"
              echo "edits to safety copy must themselves be reviewed."
            fi
            echo "Fix: comment '@codex review' on this PR, then re-run."
          fi

          if [ "$open_p1" -gt 0 ]; then
            failed=1
            echo "::error::$open_p1 unresolved P1 safety finding(s)."
            echo "Address each, then mark its conversation Resolved. Replying is not enough —"
            echo "resolution is the deliberate human checkpoint for health content."
          fi

          if [ "$open_p2" -gt 0 ]; then
            echo "::warning::$open_p2 unresolved P2 finding(s) — not blocking."
          fi

          [ "$failed" -eq 0 ] || exit 1
          echo "Safety review is current and no P1 findings are open."
