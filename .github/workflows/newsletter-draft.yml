name: Weekly newsletter draft

# Builds the weekly roundup DRAFT on Wednesday morning, New York time, and
# uploads it as an artifact for review: draft.md, draft.html, preview-local.html and manifest.json
# (or report.md/report.html when there is nothing new). It never sends email,
# needs no secrets, and cannot commit — the token is read-only. Sending is a
# separate, manual, approval-gated step (Thursday 10:00 New York) described in
# docs/weekly-newsletter.md; recording a send is a separate manual commit.
#
# GitHub cron is UTC-only, so 09:00 New York is declared for both offsets and
# scripts/newsletter/schedule-guard.mjs lets through only the cron matching the
# offset in force that day. It keys on the offset, not the hour, so a run that
# GitHub starts late still happens exactly once.

on:
  schedule:
    - cron: '0 13 * * 3' # 09:00 EDT (UTC-4)
    - cron: '0 14 * * 3' # 09:00 EST (UTC-5)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: newsletter-draft
  cancel-in-progress: false

jobs:
  draft:
    name: Generate weekly draft
    # Drafts come from reviewed content on main only; a dispatch from another
    # branch is skipped rather than drafting from unmerged posts.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # Event fields reach the script as environment variables, never as
      # text spliced into the shell command.
      - name: Check the New York schedule
        id: guard
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: node scripts/newsletter/schedule-guard.mjs

      # Node built-ins only — no npm install, so no third-party code runs here.
      # Fails closed (non-zero, no draft) on malformed posts or ledger, or if
      # any new post is not confirmed live on concretecomeback.com.
      - name: Generate draft
        if: steps.guard.outputs.run == 'true'
        run: node scripts/newsletter/generate-draft.mjs --out "$RUNNER_TEMP/weekly-newsletter"

      - name: Upload draft artifacts
        if: steps.guard.outputs.run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: weekly-newsletter-draft-${{ github.run_id }}
          path: ${{ runner.temp }}/weekly-newsletter/
          if-no-files-found: error
          retention-days: 30
