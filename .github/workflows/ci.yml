name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, type-check, links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the duplicate-post check diffs the branch against main,
          # which a shallow clone cannot do.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The blog generator has no memory between runs and has already republished
      # a live slug (see scripts/check-duplicate-posts.mjs).
      - name: Check for duplicate blog posts
        run: node scripts/check-duplicate-posts.mjs --base origin/${{ github.base_ref || 'main' }}

      # Excluded from `npm run build` on purpose (see CLAUDE.md), so run it explicitly.
      # Exits 0 on hints, non-zero on errors.
      - name: Type-check
        run: npx astro check

      - name: Test submission flow
        run: npm test

      - name: Build
        run: npm run build

      # Must crawl a real server, not the filesystem: pages are emitted as
      # directories (format: 'directory') and tag links carry query strings,
      # so /blog?tag=x only resolves over HTTP.
      - name: Serve built site
        run: npm run preview -- --host 127.0.0.1 --port 4321 &

      - name: Wait for server
        run: npx --yes wait-on http://127.0.0.1:4321 --timeout 60000

      # Internal links only. The directory collections link out to hundreds of
      # third-party sites, which would make this slow and flaky.
      - name: Check internal links
        run: |
          npx --yes linkinator@6 http://127.0.0.1:4321 \
            --recurse \
            --skip "^https?://(?!127\.0\.0\.1)"

  lighthouse:
    name: Lighthouse budgets
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Rebuilding beats passing an artifact between jobs — the build is sub-second.
      - name: Build
        run: npm run build

      - name: Serve built site
        run: npm run preview -- --host 127.0.0.1 --port 4321 &

      - name: Wait for server
        run: npx --yes wait-on http://127.0.0.1:4321 --timeout 60000

      - name: Lighthouse
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://127.0.0.1:4321/
            http://127.0.0.1:4321/directory/parks/
            http://127.0.0.1:4321/blog/
            http://127.0.0.1:4321/faq/
          configPath: ./.lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
